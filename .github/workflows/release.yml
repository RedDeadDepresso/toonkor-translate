name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go 1.25
        shell: pwsh
        run: |
          $version = "1.25.0"
          $url = "https://go.dev/dl/go${version}.windows-amd64.zip"
          $zip = "$env:TEMP\go.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "C:\Go125" -Force
          echo "C:\Go125\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GOROOT=C:\Go125\go" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          $gopath = go env GOPATH
          echo "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Download Go dependencies
        run: go mod download

      - name: Build
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          task windows:build \
            BUILD_FLAGS="-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -H windowsgui -X toonkor-translate/backend/services.Version=${VERSION}\""
        env:
          CGO_ENABLED: 0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package installer
        run: task windows:package

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            bin/toonkor-translate.exe
            bin/toonkor-translate-amd64-installer.exe
          generate_release_notes: true