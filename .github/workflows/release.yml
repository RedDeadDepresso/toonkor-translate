name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    env:
      GOTOOLCHAIN: local
      GONOSUMCHECK: "*"
      GOFLAGS: ""

    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get version without v prefix
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Go 1.25
        shell: pwsh
        run: |
          $ver = "1.25.0"
          $url = "https://go.dev/dl/go${ver}.windows-amd64.zip"
          $zip = "$env:TEMP\go.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "C:\Go125" -Force
          echo "C:\Go125\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "GOROOT=C:\Go125\go" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Go
        run: go version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          $gopath = go env GOPATH
          echo "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Tidy and download Go dependencies
        run: |
          go mod tidy
          go mod download

      - name: Update version in info.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $info = Get-Content build/windows/info.json | ConvertFrom-Json
          $info.fixed.file_version = $version
          $info.info."0000".ProductVersion = $version
          $info | ConvertTo-Json -Depth 10 | Set-Content build/windows/info.json

      - name: Build
        run: task windows:build
        env:
          CGO_ENABLED: 0
          GOFLAGS: -ldflags=-X=toonkor-translate/backend/services.Version=${{ steps.tag.outputs.tag }}

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package installer
        run: task windows:package

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            bin/toonkor-translate.exe
            bin/toonkor-translate-amd64-installer.exe
          generate_release_notes: true