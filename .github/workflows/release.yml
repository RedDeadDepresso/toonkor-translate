name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          task windows:build \
            BUILD_FLAGS="-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -H windowsgui -X toonkor-translate/backend/services.Version=${VERSION}\""
        env:
          CGO_ENABLED: 0

      - name: Install NSIS
        run: choco install nsis --yes

      - name: Package installer
        run: task windows:package

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            bin/toonkor-translate.exe
            build/windows/nsis/toonkor-translate-installer.exe
          generate_release_notes: true